seed: 2024

model:
  fusion:
    name: xattn
    n_layers: 2
    n_heads: 4
    attn_pdrop: 0.0
    proj_pdrop: 0.1
    path_pdrop: 0.1
    xattn_mode: affine

  cls_head:
    name: cls
    n_layers: 2

  reg_head:
    name: reg
    n_layers: 2

  conf_head:
    name: cls
    n_layers: 2

train:
  train_stage: base
  init_ckpt: null
  init_ckpt_use_ema: true
  conf_loss_weight: 1.0
  hard_neg_conf: false
  hard_neg_cls_thr: 0.3
  hard_neg_ratio: 1.0
  lambda_neg_conf: 0.05

  center_sampling: radius
  center_sampling_radius: 1.5

  eval: false
  eval_epoch_interval: 1
  
eval:
  data:
    split: test

  eval_mode: streaming
  max_vid_len: 9216
  ranks: [1, 5]
  iou_threshs: [0.3, 0.5, 0.7]

  pre_nms_topk: 200
  pre_nms_thresh: 0.001
  future_topk: 10
  seg_len_thresh: 0.1
  cls_threshold: 0.3
  score_alpha: 2.0
  trigger_threshold: 0.4
  max_rank_num: 5
  stream_thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  stream_nms_iou: 0.7

  ckpt: null

log:
  log_interval: 100
  checkpoint_epochs: [13, 14, 15, 16]

_resume: null
_distributed: false
_root: results
